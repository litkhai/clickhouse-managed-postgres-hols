# Ports and names differ from ../pg-clickhouse-lab so both labs can run side by side.
services:
  clickhouse:
    # ClickHouse 26.9.7.9, pinned to the multi-arch index digest (same pin as ../pg-clickhouse-lab, 2026-10-01)
    image: clickhouse/clickhouse-server:26.9.7.9@sha256:1f9c29a753cc07f9e2272a9d9383a840b222bbda78166da39dd10eecafe6500d
    container_name: pgvec-clickhouse
    hostname: clickhouse
    ports:
      - "18123:8123"   # HTTP, also the Play UI at http://localhost:18123/play
      - "19000:9000"   # Native TCP (binary driver)
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - pgvec_net

  postgres:
    # pg_clickhouse 0.11.1 on PostgreSQL 18 plus pgvector 0.8.7, built locally from postgres/Dockerfile.
    build:
      context: ./postgres
    image: pgvec-postgres:18-0.11.1-0.8.7
    container_name: pgvec-postgres
    hostname: postgres
    # The pgvector HNSW build in step 01 needs the graph in maintenance_work_mem; shm backs the parallel build.
    shm_size: 3g
    command: ["postgres", "-c", "maintenance_work_mem=2GB", "-c", "max_parallel_maintenance_workers=4"]
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - pgvec_net

networks:
  pgvec_net:
    name: pgvec_net
    driver: bridge
